<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExploreScape</title>

  <!-- fontawesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <!-- stylesheet -->
   <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header>
    <nav>
      <a class="nav-items active">ホーム</a>
      <a class="nav-items">紹介</a>
      <a class="nav-items">レビュー</a>
      <a class="nav-items">ギャラリー</a>
      <a class="nav-items">お問い合わせ</a>
    </nav>
  </header>

  <div class="content">
    <img src="img/bac 3.png" alt="background" class="back-3">

    <div class="title">
      <h3>まだ見ぬ美の大地</h3>
      <h1>アーッ</h1>
    </div>

    <img src="img/bac 2.2.png" alt="background" class="back-2">
    <img src="img/bac 1.png" alt="background" class="back-1">

    <div class="info-wrap">
      <p>
        アーッは myworld にある熱帯の楽園で、息をのむような景観、豊かな文化、そして静かな水郷で知られています。スリル満点の冒険を求める人も、のんびりと癒やしを求める人も、インド独自の伝統に触れたい人も、ケーララには誰にでも楽しめる何かがあります。緑豊かな高原リゾートから手つかずのビーチ、アーユルヴェーダのリトリートから活気あふれる祭りまで、この魅惑的な地は自然美と文化体験の完璧な調和を提供します。
      </p>
    </div>
    

    <div class="cta">
      <button>
        もっと見る
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>

    <div class="slider">
      <i class="fa-solid fa-chevron-left"></i>
      <i class="fa-solid fa-chevron-right"></i>
    </div>
  </div>
  
</body>

</html>
